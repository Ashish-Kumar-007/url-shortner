services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/url_shortener
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      SEO_INDEXABLE: ${SEO_INDEXABLE:-false}
      ASYNC_CLICK_ANALYTICS: ${ASYNC_CLICK_ANALYTICS:-true}
      CREATE_RATE_LIMIT_COUNT: ${CREATE_RATE_LIMIT_COUNT:-60}
      CREATE_RATE_LIMIT_WINDOW_SECONDS: ${CREATE_RATE_LIMIT_WINDOW_SECONDS:-60}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      BLOCK_PRIVATE_DESTINATIONS: ${BLOCK_PRIVATE_DESTINATIONS:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/url_shortener
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
